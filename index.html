<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tech@recruiter:~$</title>
<style>
  :root{
    --bg: #0d1117;
    --bg-term: #0a0e14;
    --fg: #c9d1d9;
    --green: #7ee787;
    --cyan: #56d4dd;
    --yellow: #e3b341;
    --magenta: #d2a8ff;
    --dim: #6e7681;
    --red: #ff7b72;
    --border: #21262d;
    --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-mono);
    min-height:100vh;
  }
  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 4vh 16px 8vh;
  }
  .window{
    width:100%;
    max-width: 820px;
    background: var(--bg-term);
    border:1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    overflow:hidden;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background: #161b22;
    border-bottom:1px solid var(--border);
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.red{ background:#ff5f56; }
  .dot.yellow{ background:#ffbd2e; }
  .dot.green{ background:#27c93f; }
  .titlebar-label{
    flex:1;
    text-align:center;
    font-size:12.5px;
    color: var(--dim);
    letter-spacing:.02em;
  }
  .term{
    padding: 20px 20px 28px;
    font-size: 14px;
    line-height:1.65;
    min-height: 60vh;
  }
  .line{ white-space:pre-wrap; word-break:break-word; }
  .prompt{ color: var(--green); }
  .path{ color: var(--cyan); }
  .cmd{ color: var(--fg); }
  .out{ color: var(--fg); margin: 2px 0 14px 0; }
  .comment{ color: var(--dim); }
  .heading{ color: var(--yellow); }
  .link{ color: var(--cyan); text-decoration: underline; text-underline-offset:2px; }
  .link:hover{ color: var(--magenta); }
  .badge{ color: var(--magenta); }
  .cursor{
    display:inline-block;
    width:8px; height:16px;
    background: var(--green);
    margin-left:2px;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  ul{ margin:4px 0 14px 0; padding-left: 20px; }
  li{ margin-bottom:3px; }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap:6px 20px;
    margin: 4px 0 14px 0;
  }
  #input-line{ display:flex; align-items:center; gap:6px; }
  #cmdInput{
    background:transparent;
    border:none;
    outline:none;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size:14px;
    flex:1;
    caret-color: var(--green);
  }
  .helptag{
    color: var(--dim);
    font-size:12px;
    margin-top:2px;
  }
  ::selection{ background: rgba(126,231,135,0.25); }
  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; }
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
    <span class="titlebar-label">tech@recruiter: ~</span>
  </div>
  <div class="term" id="term">
    <div id="output"></div>
    <div id="input-line" style="display:none;">
      <span class="prompt">tech@recruiter</span><span class="path">:~$</span>
      <input id="cmdInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <span class="cursor"></span>
    </div>
    <div class="helptag" id="helptag" style="display:none;">digite <span class="badge">help</span> para ver os comandos disponíveis</div>
  </div>
</div>

<script>
const output = document.getElementById('output');
const inputLine = document.getElementById('input-line');
const input = document.getElementById('cmdInput');
const helptag = document.getElementById('helptag');

function el(tag, cls, html){
  const e = document.createElement('div');
  if(cls) e.className = cls;
  e.innerHTML = html;
  return e;
}

function promptLine(cmd){
  return `<span class="prompt">tech@recruiter</span><span class="path">:~$</span> <span class="cmd">${cmd}</span>`;
}

// Conteúdo de cada comando
const commands = {
  whoami: `<div class="out"><span class="heading">Alisson Lindner Lima</span>
Analista de Infraestrutura (DevOps) &middot; Analista de Suporte
São Leopoldo, RS &middot; (51) 98947-7919 &middot; lindnerlima05@gmail.com
Idiomas: Português (nativo) &middot; Inglês (intermediário)</div>`,

  'cat sobre.txt': `<div class="out">Profissional de TI com experiência em suporte técnico, troubleshooting e
resolução de incidentes, hoje atuando em infraestrutura.

Trabalho com provisionamento e gerenciamento de infraestrutura via Terraform,
deploys com Helm, pipelines CI/CD e ambientes em cloud. Estou aprofundando
meus conhecimentos em Segurança da Informação e tenho experiência em suporte técnico.

Busco oportunidades para aplicar essa experiência e continuar evoluindo.</div>`,

  'ls experiencia/': `<div class="out">2025-presente   analista-infraestrutura-devops - Empresa: NTConsult/
2021-2025       analista-suporte-senior-I- Empresa: Linx/
2019-2020       analista-suporte-I- Empresa: Lydians/
2012-2016       assistente-administrativo- Empresa: Grupo-Editorial-Sinos/</div>`,

  'cat experiencia/atual': `<div class="out"><span class="heading">Analista de Infraestrutura (DevOps) — NTConsult</span>  <span class="comment">2025 - presente</span>
  - Administração e suporte a ambientes de infraestrutura e aplicações;
  - Investigação e resolução de incidentes em produção e ambientes não-produtivos;
  - Monitoramento e troubleshooting de aplicações e serviços;
  - Provisionamento de infraestrutura com Terraform e Helm;
  - Pipelines CI/CD e ambientes em cloud</div>`,

  'ls certificacoes/': `<div class="out"><ul>
  <li>Fortinet Certified Fundamentals Cybersecurity <span class="comment">— Fortinet, 2022</span></li>
  <li>Cybersecurity Essentials <span class="comment">— CISCO, 2023</span></li>
  <li>Cybersecurity Awareness <span class="comment">— IBSEC, 2022</span></li>
  <li>Introduction to Cybersecurity <span class="comment">— CISCO, 2019</span></li>
</ul></div>`,

  'cat formacao.txt': `<div class="out"><ul>
  <li><b>MBA em Segurança da Informação</b> <span class="comment">— Descomplica, 2025-2026</span></li>
  <li><b>MBA em Defesa e Segurança Cibernética</b> <span class="comment">— Uninter, 2021-2022</span></li>
  <li><b>Tecnólogo em Análise e Desenvolvimento de Sistemas</b> <span class="comment">— Uninter, 2019-2021</span></li>
</ul></div>`,

  'cat skills.json': `<div class="out">{
  "infraestrutura": ["Terraform", "Helm", "Kubernetes", "CI/CD", "linux"],
  "suporte": ["N1/N2", "Troubleshooting", "Análise de logs", "Acesso remoto"]
}</div>`,

  'cat idiomas.txt': `<div class="out"><ul>
  <li>Português <span class="comment">— nativo</span></li>
  <li>Inglês <span class="comment">— intermediário</span></li>
</ul></div>`,

  contato: `<div class="out">📍 São Leopoldo, Rio Grande do Sul
📞 (51) 98947-7919
✉️  <a class="link" href="mailto:lindnerlima05@gmail.com">lindnerlima05@gmail.com</a>
🔗 <a class="link" href="#" target="_blank">linkedin.com/in/alissonlindner</a></div>`,

  help: `<div class="out">Comandos disponíveis:
  <span class="badge">whoami</span>                 — quem sou eu
  <span class="badge">cat sobre.txt</span>           — resumo profissional
  <span class="badge">ls experiencia/</span>         — histórico profissional
  <span class="badge">cat experiencia/atual</span> — experiência atual
  <span class="badge">ls certificacoes/</span>       — certificações
  <span class="badge">cat formacao.txt</span>        — formação acadêmica
  <span class="badge">cat skills.json</span>         — competências técnicas
  <span class="badge">cat idiomas.txt</span>         — idiomas
  <span class="badge">contato</span>                 — formas de contato
  <span class="badge">clear</span>                   — limpar a tela</div>`,
};

function print(html){
  const line = document.createElement('div');
  line.className = 'line';
  line.innerHTML = html;
  output.appendChild(line);
}

function runCommand(raw){
  const cmd = raw.trim();
  print(promptLine(cmd || '&nbsp;'));
  if(cmd === '') return;
  if(cmd === 'clear'){
    output.innerHTML = '';
    return;
  }
  if(commands[cmd]){
    print(commands[cmd]);
  } else {
    print(`<div class="out"><span class="red">bash: ${cmd.split(' ')[0]}: comando não encontrado</span> — digite <span class="badge">help</span> para ver as opções</div>`);
  }
}

// Sequência de boas-vindas digitada automaticamente
const introSequence = [
  { cmd: 'help', out: commands['help'] },
];

let seqIndex = 0;

function typeLine(text, cb){
  const wrap = document.createElement('div');
  wrap.className = 'line';
  const promptSpan = document.createElement('span');
  promptSpan.innerHTML = `<span class="prompt">tech@recruiter</span><span class="path">:~$</span> `;
  const cmdSpan = document.createElement('span');
  cmdSpan.className = 'cmd';
  wrap.appendChild(promptSpan);
  wrap.appendChild(cmdSpan);
  output.appendChild(wrap);

  let i = 0;
  const speed = 45;
  const timer = setInterval(()=>{
    cmdSpan.textContent += text[i];
    i++;
    if(i >= text.length){
      clearInterval(timer);
      setTimeout(cb, 250);
    }
  }, speed);
}

function runIntro(){
  if(seqIndex >= introSequence.length){
    // fim da intro: mostra prompt real
    inputLine.style.display = 'flex';
    input.focus();
    return;
  }
  const step = introSequence[seqIndex];
  typeLine(step.cmd, ()=>{
    print(step.out);
    seqIndex++;
    setTimeout(runIntro, 300);
  });
}

// Foco automático no input quando clicar em qualquer lugar do terminal
document.getElementById('term').addEventListener('click', ()=> input.focus());

input.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const val = input.value;
    input.value = '';
    runCommand(val);
    document.getElementById('term').scrollTop = document.getElementById('term').scrollHeight;
    window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });
  }
});

window.addEventListener('load', ()=>{
  setTimeout(runIntro, 400);
});
</script>

</body>
</html>
